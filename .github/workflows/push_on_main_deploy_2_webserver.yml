name: CI/CD Workflow to Nginx for branch main
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Deploy via SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          git-cmd: true
      - name: Run deployment script
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@193.196.36.158 "cd /var/www/legolab-karlsruhe.de/main && git fetch origin main && git reset --hard origin/main && npm install --ignore-scripts && npm run build && pm2 restart nextjs-prod"