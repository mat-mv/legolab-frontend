name: CI/CD Workflow to Nginx for branch main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          git-cmd: true

      - name: Run deployment script
        run: |
          run: |
            ssh -o StrictHostKeyChecking=no ubuntu@193.196.36.158 "cd /var/www/legolab-karlsruhe.de/dev && git fetch origin dev && git reset --hard origin/dev && npm install --ignore-scripts && npm run build && pm2 restart nextjs-dev"