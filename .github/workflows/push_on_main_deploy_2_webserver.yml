name: Deploy main (manuell)

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Host-Key des Servers fest hinterlegen, damit der Workflow nur mit
      # dem echten Server spricht (kein StrictHostKeyChecking=no).
      - name: Known hosts setzen
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" main
